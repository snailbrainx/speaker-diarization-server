services:
  speaker-diarization:
    build: .
    container_name: speaker-diarization-server
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      # Without this, CUDA enumerates by FASTEST_FIRST and CUDA_VISIBLE_DEVICES
      # indices stop matching nvidia-smi (e.g. index 0 would pick the 5090 even
      # if you meant the 3090). PCI_BUS_ID keeps the two in sync.
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - DATABASE_URL=sqlite:////app/volumes/speakers.db
      - HF_TOKEN=${HF_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Tunables below intentionally default to EMPTY. An empty value is
      # skipped by the config loader, so values persisted by the Settings API
      # survive restarts. Set a value explicitly (in .env) to force-override.
      - SPEAKER_THRESHOLD=${SPEAKER_THRESHOLD:-}
      - CONTEXT_PADDING=${CONTEXT_PADDING:-}
      - SILENCE_DURATION=${SILENCE_DURATION:-}
      - FILTER_HALLUCINATIONS=${FILTER_HALLUCINATIONS:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-en}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
    # Match the `app` user baked into the image (uid 1000) so bind-mounted
    # volumes stay writable without chown gymnastics on the host.
    user: "1000:1000"
    ports:
      - "8418:8418"
    volumes:
      # SSL certificates for HTTPS/WSS
      - ./certs:/app/certs:ro
      # Persistent storage: speaker DB, embeddings, and HuggingFace model cache.
      # HF_HOME is /app/volumes/huggingface_cache (set in the Dockerfile) so
      # everything pyannote + faster-whisper download lives under this mount.
      - ./volumes:/app/volumes
      # Audio recordings and temp files
      - ./data:/app/data
      # Backup snapshots
      - ./backups:/app/backups
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # `device_ids` only accepts concrete device IDs/UUIDs — the
              # previous default `['${GPU_DEVICE_ID:-all}']` rendered to
              # `['all']`, which is not a valid device_ids value. Reserve all
              # GPUs here; the effective card is still selected by
              # CUDA_VISIBLE_DEVICES above (and NVIDIA_VISIBLE_DEVICES), which
              # is what the container runtime actually honours. To restrict
              # the reservation to one card, set GPU_COUNT=1 in .env and swap
              # `count` for `device_ids: ['<uuid>']` (nvidia-smi -L).
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    restart: unless-stopped

# Development convenience: docker-compose.override.yml bind-mounts ./app
# over the image's /app/app for live reloads. Delete or rename that file
# (or `docker compose -f docker-compose.yml up` without the override) for a
# production run that uses only the baked-in code.
